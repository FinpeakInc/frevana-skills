<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https: http:; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Draft ad preview</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 2rem 1rem; background: #f6f6f3; color: #242622; font: 1rem/1.5 Inter, system-ui, sans-serif; }
    main { max-width: 30rem; margin: auto; }
    h1 { margin: 0 0 .8rem; font-size: 1rem; font-weight: 550; }
    article { overflow: hidden; overflow-wrap: anywhere; border: 1px solid #d9dcd4; border-radius: 1rem; background: white; }
    img { display: block; width: 100%; max-height: 20rem; object-fit: contain; background: #f0f1ed; }
    .asset { padding: 3rem 1.25rem; margin: 0; text-align: center; background: #eef0eb; }
    section { padding: 1.25rem; }
    h2 { margin: 0; font-size: 1.45rem; line-height: 1.25; }
    section p { margin: .6rem 0 1rem; white-space: pre-wrap; }
    a { color: #3c5548; font-size: .875rem; }
  </style>
</head>
<body>
  <main>
    <h1>Draft ad preview</h1>
    <article>
      $media
      <section>
        <h2>$title</h2>
        <p>$body</p>
        <a href="$destination" rel="noreferrer">$destination</a>
      </section>
    </article>
  </main>
</body>
</html>
