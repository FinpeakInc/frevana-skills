<!doctype html>
<html lang="{language}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{page_title}</title>
  <meta name="description" content="{meta_description}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@700;800&family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {{
      --font-display: "Host Grotesk", Inter, system-ui, sans-serif;
      --font-body: "Open Sans", system-ui, sans-serif;
      --ink: #111827;
      --ink-hero: #1c1f25;
      --ink-body: #565656;
      --muted: #717171;
      --subtle: #6b7280;
      --disabled: #9ca3af;
      --green: #3d9040;
      --green-soft: #effdf4;
      --line: #edeef1;
      --ui-border: #d1d5db;
      --surface: #ffffff;
      --dark-cta: #212121;
      --footer: #283137;
      --footer-line: #3a4149;
      --footer-muted: #b0b0b0;
      --white: #ffffff;
      --radius-xs: 4px;
      --radius-sm: 6px;
      --radius-md: 12px;
      --container: 1280px;
      --footer-max: 1320px;
      --container-pad: 40px;
      --container-pad-mobile: 20px;
      --feature-gap: 60px;
      --feature-gap-xl: 110px;
    }}

    * {{
      box-sizing: border-box;
    }}

    html {{
      scroll-behavior: smooth;
    }}

    body {{
      margin: 0;
      background: var(--surface);
      color: var(--ink);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }}

    a {{
      color: inherit;
      text-decoration: none;
    }}

    img {{
      display: block;
      max-width: 100%;
    }}

    .site-header {{
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }}

    .site-header__inner {{
      width: min(var(--container), calc(100% - 80px));
      min-height: 70px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 26px;
    }}

    .brand {{
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.04em;
    }}

    .brand__mark {{
      width: 31px;
      height: 31px;
      border-radius: 11px;
      background:
        radial-gradient(circle at 68% 30%, #ffffff 0 11%, transparent 12%),
        linear-gradient(135deg, #61b968, var(--green));
      box-shadow: inset 0 -7px 14px rgba(47, 118, 50, 0.28);
    }}

    .nav {{
      display: flex;
      align-items: center;
      gap: 40px;
      color: var(--ink-body);
      font-size: 15px;
      font-weight: 400;
    }}

    .nav__link,
    .nav__trigger {{
      display: inline-flex;
      align-items: center;
      min-height: 42px;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }}

    .nav__link:hover,
    .nav__trigger:hover,
    .nav__link:focus-visible,
    .nav__trigger:focus-visible {{
      color: var(--ink);
      outline: none;
    }}

    .solutions-menu {{
      position: relative;
    }}

    .solutions-menu__panel {{
      position: absolute;
      top: calc(100% + 12px);
      left: 50%;
      width: min(920px, calc(100vw - 40px));
      padding: 38px 48px;
      display: grid;
      grid-template-columns: 1.2fr 0.9fr;
      gap: 58px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 18px 48px rgba(17, 24, 39, 0.10);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 8px);
      transition: opacity 160ms ease, transform 160ms ease;
    }}

    .solutions-menu:hover .solutions-menu__panel,
    .solutions-menu:focus-within .solutions-menu__panel {{
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, 0);
    }}

    .solutions-menu__title {{
      margin: 0 0 24px;
      color: var(--disabled);
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }}

    .solutions-menu__list {{
      display: grid;
      gap: 28px;
    }}

    .solution-choice {{
      display: grid;
      grid-template-columns: 42px 1fr;
      gap: 16px;
      align-items: start;
      color: var(--ink);
    }}

    .solution-choice__icon {{
      width: 34px;
      height: 34px;
      display: inline-grid;
      place-items: center;
      border-radius: 12px;
      color: var(--ink-body);
      font-size: 23px;
    }}

    .solution-choice strong {{
      display: block;
      margin-bottom: 8px;
      font-family: var(--font-display);
      font-size: 25px;
      line-height: 1.05;
      letter-spacing: -0.04em;
    }}

    .solution-choice span {{
      color: var(--muted);
      font-size: 19px;
      line-height: 1.45;
    }}

    .header-actions {{
      display: flex;
      align-items: center;
      gap: 13px;
      white-space: nowrap;
    }}

    .language-pill {{
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--ui-border);
      border-radius: 999px;
      color: var(--ink-body);
      font-size: 15px;
      font-weight: 700;
    }}

    .login-link {{
      color: var(--ink-body);
      font-size: 16px;
      font-weight: 700;
    }}

    .trial-link {{
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 6px;
      background: var(--dark-cta);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
    }}

    .solution-page {{
      overflow: hidden;
      padding-top: 70px;
    }}

    .container {{
      width: min(var(--container), calc(100% - (var(--container-pad) * 2)));
      margin-inline: auto;
    }}

    .eyebrow {{
      display: inline-flex;
      align-items: center;
      width: fit-content;
      min-height: auto;
      padding: 8px 24px;
      border: 0;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green);
      font-size: 20px;
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: 0;
    }}

    .hero {{
      position: relative;
      padding: 103px 0 110px;
    }}

    .hero::before {{
      content: "";
      position: absolute;
      inset: 22px -15vw auto auto;
      width: 54vw;
      height: 54vw;
      max-width: 720px;
      max-height: 720px;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(239, 253, 244, 0.92), rgba(255, 255, 255, 0));
      pointer-events: none;
    }}

    .hero__grid {{
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(380px, 1fr);
      gap: clamp(var(--feature-gap), 7vw, var(--feature-gap-xl));
      align-items: center;
    }}

    .hero h1 {{
      max-width: 760px;
      margin: 26px 0 24px;
      font-family: var(--font-display);
      font-size: 58px;
      line-height: 77px;
      letter-spacing: 0;
      font-weight: 800;
    }}

    .hero__body {{
      max-width: 650px;
      margin: 0 0 34px;
      color: var(--muted);
      font-size: 20px;
      line-height: 1.6;
    }}

    .button {{
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 56px;
      padding: 0 24px;
      border-radius: 6px;
      border: 1px solid transparent;
      background: var(--dark-cta);
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      box-shadow: none;
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }}

    .button:hover,
    .button:focus-visible {{
      background: #000;
      transform: translateY(-1px);
      box-shadow: none;
      outline: none;
    }}

    .text-link-arrow {{
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--green);
      font-size: 20px;
      font-weight: 600;
      line-height: 1.4;
    }}

    .text-link-arrow span {{
      display: inline-block;
      transition: transform 160ms ease;
    }}

    .text-link-arrow:hover span,
    .text-link-arrow:focus-visible span {{
      transform: rotate(-35deg) translateX(2px);
    }}

    .visual-card {{
      position: relative;
      border-radius: var(--radius-lg);
      padding: 0;
      background: transparent;
      border: 0;
      box-shadow: none;
    }}

    .visual-card::after {{
      content: "";
      position: absolute;
      right: 8px;
      bottom: 34px;
      width: 86px;
      height: 20px;
      border-radius: 999px;
      background: rgba(61, 144, 64, 0.18);
      z-index: -1;
    }}

    .visual-card img {{
      width: 100%;
      aspect-ratio: 1.1 / 1;
      object-fit: contain;
      object-position: center;
      border-radius: 0;
      border: 0;
      filter: drop-shadow(0 22px 28px rgba(15, 23, 42, 0.12));
    }}

    .intro {{
      padding: 24px 0 68px;
      text-align: center;
    }}

    .intro h2,
    .module h2,
    .final-cta h2 {{
      max-width: 850px;
      margin: 22px auto 0;
      font-family: var(--font-display);
      font-size: 48px;
      line-height: 64px;
      letter-spacing: 0;
      font-weight: 600;
    }}

    .features {{
      padding: 0 0 98px;
    }}

    .feature {{
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: clamp(var(--feature-gap), 7vw, var(--feature-gap-xl));
      align-items: center;
      padding: 66px 0;
    }}

    .feature--reverse .feature__visual {{
      order: 2;
    }}

    .feature h3 {{
      margin: 20px 0 18px;
      font-family: var(--font-display);
      font-size: 48px;
      line-height: 64px;
      letter-spacing: 0;
      font-weight: 600;
    }}

    .feature p {{
      max-width: 590px;
      margin: 0 0 28px;
      color: var(--ink);
      font-size: 20px;
      line-height: 1.6;
    }}

    .feature__visual .visual-card {{
      transform: rotate(-1.1deg);
    }}

    .feature--reverse .feature__visual .visual-card {{
      transform: rotate(1.1deg);
    }}

    .module {{
      padding: 104px 0;
      background: var(--surface);
    }}

    .module__head {{
      margin-bottom: 48px;
      text-align: center;
    }}

    .module__panel {{
      display: grid;
      grid-template-columns: minmax(260px, 0.42fr) minmax(0, 1fr);
      gap: 28px;
      align-items: stretch;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: #fff;
      box-shadow: none;
    }}

    .module__tabs {{
      display: flex;
      flex-direction: column;
      gap: 0;
      align-content: start;
      padding: 0;
      border-radius: 0;
      background: #fff;
    }}

    .module__tab {{
      width: 100%;
      min-height: 52px;
      padding: 0 16px;
      border: 1px solid transparent;
      border-radius: 0;
      background: transparent;
      color: var(--disabled);
      text-align: left;
      font: 600 16px/1.4 var(--font-body);
      cursor: pointer;
    }}

    .module__tab[aria-selected="true"] {{
      border-color: transparent;
      border-bottom-color: var(--ink);
      border-bottom-width: 2px;
      background: #fff;
      color: var(--ink);
      box-shadow: none;
    }}

    .module__content {{
      display: grid;
      grid-template-columns: minmax(0, 0.86fr) minmax(290px, 0.72fr);
      gap: 32px;
      align-items: center;
      padding: 32px;
    }}

    .module__copy h3 {{
      margin: 0 0 18px;
      font-family: var(--font-display);
      font-size: 48px;
      line-height: 64px;
      letter-spacing: 0;
      font-weight: 600;
    }}

    .module__copy p {{
      margin: 0;
      color: var(--ink);
      font-size: 20px;
      line-height: 1.6;
    }}

    .module__image {{
      border-radius: 28px;
      box-shadow: none;
    }}

    .module__image img {{
      width: 100%;
      aspect-ratio: 1.12 / 1;
      object-fit: contain;
      object-position: center;
      border-radius: 0;
      filter: drop-shadow(0 22px 28px rgba(15, 23, 42, 0.14));
    }}

    .final-cta {{
      padding: 150px 0;
      text-align: center;
    }}

    .final-cta__card {{
      position: relative;
      max-width: 852px;
      margin-inline: auto;
      padding: 0 32px;
      overflow: hidden;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }}

    .final-cta p {{
      max-width: 650px;
      margin: 22px auto 32px;
      color: var(--ink);
      font-size: 20px;
      line-height: 1.6;
    }}

    .site-footer {{
      border-top: 1px solid var(--footer-line);
      background: var(--footer);
      color: #fff;
    }}

    .site-footer__inner {{
      width: min(var(--footer-max), calc(100% - (var(--container-pad) * 2)));
      margin: 0 auto;
      padding: 54px 0 44px;
    }}

    .site-footer__top {{
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
      margin-bottom: 34px;
    }}

    .social-links,
    .footer-links {{
      display: flex;
      flex-wrap: wrap;
      gap: 16px 22px;
      color: var(--footer-muted);
      font-size: 15px;
      font-weight: 700;
    }}

    .footer-links {{
      padding-top: 26px;
      border-top: 1px solid var(--footer-line);
    }}

    .copyright {{
      margin: 28px 0 0;
      color: var(--footer-muted);
      font-size: 14px;
    }}

    @media (max-width: 1100px) {{
      .site-header__inner {{
        min-height: auto;
        padding: 18px 0;
        align-items: flex-start;
        flex-wrap: wrap;
      }}

      .nav {{
        order: 3;
        width: 100%;
        gap: 18px;
        overflow-x: auto;
        padding-bottom: 4px;
      }}

      .solutions-menu__panel {{
        left: 0;
        transform: translate(0, 8px);
      }}

      .solutions-menu:hover .solutions-menu__panel,
      .solutions-menu:focus-within .solutions-menu__panel {{
        transform: translate(0, 0);
      }}

      .hero__grid,
      .feature,
      .module__panel,
      .module__content {{
        grid-template-columns: 1fr;
      }}

      .feature--reverse .feature__visual {{
        order: 0;
      }}
    }}

    @media (max-width: 760px) {{
      .site-header__inner,
      .container,
      .site-footer__inner {{
        width: min(100% - (var(--container-pad-mobile) * 2), var(--container));
      }}

      .header-actions {{
        width: 100%;
        justify-content: space-between;
      }}

      .nav {{
        font-size: 15px;
      }}

      .solutions-menu__panel {{
        grid-template-columns: 1fr;
        gap: 30px;
        padding: 28px;
      }}

      .solution-choice strong {{
        font-size: 22px;
      }}

      .solution-choice span {{
        font-size: 16px;
      }}

      .hero {{
        padding: 58px 0 72px;
      }}

      .hero__grid {{
        gap: 42px;
      }}

      .hero h1 {{
        font-size: 28px;
        line-height: 36px;
        letter-spacing: 0;
      }}

      .intro h2,
      .module h2,
      .final-cta h2,
      .feature h3,
      .module__copy h3 {{
        font-size: 28px;
        line-height: 36px;
      }}

      .hero__body,
      .feature p,
      .module__copy p,
      .final-cta p {{
        font-size: 16px;
      }}

      .eyebrow {{
        min-height: auto;
        padding: 8px 16px;
        font-size: 14px;
        font-weight: 600;
        line-height: 1.4;
      }}

      .button {{
        min-height: 48px;
        font-size: 16px;
      }}

      .button {{
        width: 100%;
      }}

      .intro {{
        padding-bottom: 38px;
      }}

      .feature {{
        gap: 28px;
        padding: 48px 0;
      }}

      .module {{
        padding: 76px 0;
      }}

      .module__panel {{
        padding: 0;
        border-radius: 0;
      }}

      .module__content {{
        padding: 18px;
      }}

      .module__tabs {{
        display: flex;
        overflow-x: auto;
        padding-bottom: 12px;
      }}

      .module__tab {{
        flex: 0 0 auto;
        width: auto;
        white-space: nowrap;
      }}

      .final-cta {{
        padding: 96px 0;
      }}

      .final-cta__card {{
        padding: 0 20px;
        border-radius: 0;
      }}

      .site-footer__top {{
        align-items: flex-start;
        flex-direction: column;
      }}
    }}
  </style>
</head>
<body>
  {site_header}
  {main_content}
  {site_footer}
  {module_script}
</body>
</html>
