<!doctype html>
<html lang="{language}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{page_title}</title>
  <meta name="description" content="{meta_description}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@700;800&family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {{
      --font-display: "Host Grotesk", Inter, system-ui, sans-serif;
      --font-body: "Open Sans", system-ui, sans-serif;
      --ink: #111827;
      --ink-hero: #1c1f25;
      --ink-body: #565656;
      --muted: #717171;
      --subtle: #6b7280;
      --disabled: #9ca3af;
      --green: #3d9040;
      --green-soft: #effdf4;
      --line: #edeef1;
      --ui-border: #d1d5db;
      --surface: #ffffff;
      --dark-cta: #212121;
      --footer: #283137;
      --footer-line: #3a4149;
      --footer-muted: #b0b0b0;
      --white: #ffffff;
      --radius-xs: 4px;
      --radius-sm: 6px;
      --radius-md: 12px;
      --container: 1280px;
      --footer-max: 1320px;
      --container-pad: 40px;
      --container-pad-mobile: 20px;
      --feature-gap: 60px;
      --feature-gap-xl: 110px;
    }}

    * {{
      box-sizing: border-box;
    }}

    html {{
      scroll-behavior: smooth;
    }}

    body {{
      margin: 0;
      background: var(--surface);
      color: var(--ink);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }}

    a {{
      color: inherit;
      text-decoration: none;
    }}

    img {{
      display: block;
      max-width: 100%;
    }}


    .site-header {{
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      border-bottom: 1px solid #edeef1;
      background: #fff;
    }}

    .site-header__frame {{
      padding: 12px 40px;
    }}

    .site-header__inner {{
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      min-height: 45px;
    }}

    .site-logo {{
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
    }}

    .site-logo img {{
      width: 45px;
      height: 45px;
      object-fit: contain;
    }}

    .desktop-nav {{
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 40px;
      margin-left: 48px;
      margin-right: auto;
    }}

    .nav-link {{
      display: inline-flex;
      align-items: center;
      border: 0;
      background: transparent;
      color: #565656;
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 400;
      line-height: 1.4;
      white-space: nowrap;
      cursor: pointer;
      transition: color 160ms ease;
    }}

    .nav-link:hover,
    .nav-link:focus-visible {{
      color: #1f1f1f;
      outline: none;
    }}

    .nav-dropdown {{
      position: relative;
      display: flex;
      align-items: center;
    }}

    .nav-dropdown__panel {{
      position: absolute;
      top: 100%;
      left: 0;
      z-index: 60;
      padding-top: 12px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(4px);
      transition: opacity 140ms ease, transform 140ms ease;
    }}

    .nav-dropdown:hover .nav-dropdown__panel,
    .nav-dropdown:focus-within .nav-dropdown__panel {{
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }}

    .nav-dropdown__panel--solutions > .solutions-grid {{
      width: 600px;
      display: flex;
      gap: 32px;
      padding: 24px;
      border: 1px solid #edeef1;
      border-radius: 6px;
      background: #fff;
      box-shadow: 0 10px 28px rgba(17, 24, 39, 0.12);
    }}

    .nav-dropdown__panel--solutions .solutions-grid > div:first-child {{
      flex: 1;
    }}

    .nav-dropdown__panel--case {{
      width: 400px;
    }}

    .nav-dropdown__panel--case::before {{
      content: "";
      display: block;
      padding: 16px;
      border: 1px solid #edeef1;
      border-radius: 6px;
      background: #fff;
      box-shadow: 0 10px 28px rgba(17, 24, 39, 0.12);
      position: absolute;
      inset: 12px 0 auto 0;
      height: calc(100% - 12px);
      z-index: -1;
    }}

    .dropdown-heading {{
      margin: 0 0 20px;
      padding: 0 8px;
      color: #9ca3af;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.4;
    }}

    .dropdown-list {{
      display: flex;
      flex-direction: column;
      gap: 16px;
    }}

    .dropdown-list--compact {{
      gap: 12px;
    }}

    .dropdown-item {{
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 8px;
      border-radius: 8px;
      transition: background 140ms ease;
    }}

    .dropdown-item:hover,
    .case-link:hover {{
      background: #f9fafb;
    }}

    .dropdown-item img {{
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }}

    .dropdown-item strong {{
      display: block;
      color: #111827;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.2;
    }}

    .dropdown-item small {{
      display: block;
      margin-top: 8px;
      color: #6b7280;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.35;
    }}

    .case-link {{
      position: relative;
      z-index: 1;
      display: block;
      margin: 0 16px;
      padding: 8px;
      border-radius: 8px;
      color: #111827;
      font-size: 16px;
      font-weight: 500;
      line-height: 1.45;
    }}

    .case-link:first-child {{
      margin-top: 16px;
    }}

    .case-link:last-child {{
      margin-bottom: 16px;
    }}

    .site-header__actions {{
      display: flex;
      align-items: center;
      gap: 16px;
      white-space: nowrap;
    }}

    .header-login,
    .header-trial {{
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 40px;
      padding: 0 32px;
      border-radius: 12px;
      border: 1px solid #e0e0e0;
      background: #fff;
      color: #1f1f1f;
      font-size: 15px;
      font-weight: 500;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease, box-shadow 160ms ease;
    }}

    .header-login:hover {{
      border-color: #c0c0c0;
      background: #f5f5f5;
    }}

    .header-trial {{
      border-color: #3d9040;
      background: #3d9040;
      color: #fff;
      box-shadow: 0 10px 22px rgba(61, 144, 64, 0.18);
    }}

    .header-trial:hover {{
      border-color: #2d7030;
      background: #2d7030;
      color: #fff;
      box-shadow: 0 14px 26px rgba(61, 144, 64, 0.24);
    }}

    .header-language {{
      display: inline-flex;
      align-items: center;
      color: #565656;
      font-size: 15px;
      font-weight: 500;
    }}

    .mobile-menu-button {{
      display: none;
      width: 24px;
      height: 24px;
      padding: 0;
      border: 0;
      background: transparent;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
    }}

    .mobile-menu-button span {{
      width: 16px;
      height: 2px;
      border-radius: 2px;
      background: #6b7280;
    }}

    .mobile-drawer-backdrop {{
      position: fixed;
      inset: 0;
      z-index: 70;
      background: rgba(17, 24, 39, 0.18);
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease;
    }}

    .mobile-drawer {{
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 80;
      width: 70%;
      max-width: 360px;
      min-width: 260px;
      padding: 20px 18px;
      background: #fff;
      transform: translateX(-100%);
      transition: transform 180ms ease;
      overflow-y: auto;
    }}

    .site-header.is-drawer-open .mobile-drawer-backdrop {{
      opacity: 1;
      pointer-events: auto;
    }}

    .site-header.is-drawer-open .mobile-drawer {{
      transform: translateX(0);
    }}

    .mobile-drawer__title {{
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 18px;
    }}

    .mobile-drawer .site-logo img {{
      width: 24px;
      height: 24px;
    }}

    .mobile-nav {{
      display: flex;
      flex-direction: column;
      gap: 16px;
    }}

    .mobile-nav__toggle,
    .mobile-nav__link {{
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 12px 0;
      border: 0;
      border-bottom: 1px solid #edeef1;
      background: transparent;
      color: #6b7280;
      font-size: 16px;
      font-weight: 600;
      text-align: left;
    }}

    .mobile-nav__panel {{
      display: none;
      margin-top: -8px;
      padding-bottom: 8px;
    }}

    .mobile-nav__panel.is-open {{
      display: flex;
      flex-direction: column;
      gap: 8px;
    }}

    .mobile-nav__panel h4 {{
      margin: 12px 0 4px;
      color: #9ca3af;
      font-size: 14px;
      font-weight: 600;
    }}

    .mobile-nav__panel a {{
      display: flex;
      align-items: center;
      gap: 8px;
      border-radius: 8px;
      color: #111827;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.35;
    }}

    .mobile-nav__panel img {{
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
    }}

    .mobile-nav__panel small {{
      display: block;
      margin-top: 4px;
      color: #6b7280;
      font-size: 12px;
      font-weight: 400;
    }}

    .solution-page {{
      overflow: hidden;
      padding-top: 70px;
    }}

    .container {{
      width: min(var(--container), calc(100% - (var(--container-pad) * 2)));
      margin-inline: auto;
    }}

    .eyebrow {{
      display: inline-flex;
      align-items: center;
      width: fit-content;
      min-height: auto;
      padding: 8px 24px;
      border: 0;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green);
      font-size: 20px;
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: 0;
    }}

    .hero {{
      position: relative;
      padding: 103px 0 110px;
    }}

    .hero::before {{
      content: "";
      position: absolute;
      inset: 22px -15vw auto auto;
      width: 54vw;
      height: 54vw;
      max-width: 720px;
      max-height: 720px;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(239, 253, 244, 0.92), rgba(255, 255, 255, 0));
      pointer-events: none;
    }}

    .hero__grid {{
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(380px, 1fr);
      gap: clamp(var(--feature-gap), 7vw, var(--feature-gap-xl));
      align-items: center;
    }}

    .hero h1 {{
      max-width: 760px;
      margin: 26px 0 24px;
      font-family: var(--font-display);
      font-size: 58px;
      line-height: 77px;
      letter-spacing: 0;
      font-weight: 800;
    }}

    .hero__body {{
      max-width: 650px;
      margin: 0 0 34px;
      color: var(--muted);
      font-size: 20px;
      line-height: 1.6;
    }}

    .button {{
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 56px;
      padding: 0 24px;
      border-radius: 6px;
      border: 1px solid transparent;
      background: var(--dark-cta);
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      box-shadow: none;
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }}

    .button:hover,
    .button:focus-visible {{
      background: #000;
      transform: translateY(-1px);
      box-shadow: none;
      outline: none;
    }}

    .text-link-arrow {{
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--green);
      font-size: 20px;
      font-weight: 600;
      line-height: 1.4;
    }}

    .text-link-arrow span {{
      display: inline-block;
      transition: transform 160ms ease;
    }}

    .text-link-arrow:hover span,
    .text-link-arrow:focus-visible span {{
      transform: rotate(-35deg) translateX(2px);
    }}

    .visual-card {{
      position: relative;
      border-radius: var(--radius-lg);
      padding: 0;
      background: transparent;
      border: 0;
      box-shadow: none;
    }}

    .visual-card::after {{
      content: "";
      position: absolute;
      right: 8px;
      bottom: 34px;
      width: 86px;
      height: 20px;
      border-radius: 999px;
      background: rgba(61, 144, 64, 0.18);
      z-index: -1;
    }}

    .visual-card img {{
      width: 100%;
      aspect-ratio: 1.1 / 1;
      object-fit: contain;
      object-position: center;
      border-radius: 0;
      border: 0;
      filter: none;
    }}

    .intro {{
      padding: 24px 0 68px;
      text-align: center;
    }}

    .intro h2,
    .module h2,
    .final-cta h2 {{
      max-width: 850px;
      margin: 22px auto 0;
      font-family: var(--font-display);
      font-size: 48px;
      line-height: 64px;
      letter-spacing: 0;
      font-weight: 600;
    }}

    .features {{
      padding: 0 0 98px;
    }}

    .feature {{
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: clamp(var(--feature-gap), 7vw, var(--feature-gap-xl));
      align-items: center;
      padding: 66px 0;
    }}

    .feature--reverse .feature__visual {{
      order: 2;
    }}

    .feature h3 {{
      margin: 20px 0 18px;
      font-family: var(--font-display);
      font-size: 48px;
      line-height: 64px;
      letter-spacing: 0;
      font-weight: 600;
    }}

    .feature p {{
      max-width: 590px;
      margin: 0 0 28px;
      color: var(--ink);
      font-size: 20px;
      line-height: 1.6;
    }}

    .feature__visual .visual-card {{
      transform: rotate(-1.1deg);
    }}

    .feature--reverse .feature__visual .visual-card {{
      transform: rotate(1.1deg);
    }}


    .module {{
      padding: 104px 0;
      background: var(--surface);
    }}

    .module__head {{
      margin-bottom: 70px;
      text-align: center;
    }}

    .module__panel {{
      padding: 0;
      border: 0;
      border-radius: 0;
      background: #fff;
      box-shadow: none;
    }}

    .module__tabs {{
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(22px, 3.4vw, 58px);
      margin-bottom: 54px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }}

    .module__tabs::-webkit-scrollbar {{
      display: none;
    }}

    .module__tab {{
      position: relative;
      flex: 0 0 auto;
      min-height: 44px;
      padding: 0 0 12px;
      border: 0;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      background: transparent;
      color: #9ca3af;
      text-align: center;
      font: 700 18px/1.4 var(--font-body);
      cursor: pointer;
      white-space: nowrap;
    }}

    .module__tab[aria-selected="true"] {{
      border-bottom-color: var(--ink);
      color: var(--ink);
      box-shadow: none;
    }}

    .module__content {{
      display: grid;
      grid-template-columns: minmax(0, 0.74fr) minmax(0, 1fr);
      gap: clamp(52px, 7vw, 104px);
      align-items: center;
      padding: 0;
    }}

    .module__copy h3 {{
      margin: 0 0 32px;
      font-family: var(--font-display);
      font-size: 48px;
      line-height: 64px;
      letter-spacing: 0;
      font-weight: 600;
    }}

    .module__copy p {{
      max-width: 640px;
      margin: 0;
      color: var(--ink);
      font-size: 28px;
      line-height: 1.55;
      font-weight: 600;
    }}

    .module__image {{
      justify-self: center;
      max-width: 560px;
      width: 100%;
      border-radius: 0;
      box-shadow: none;
    }}

    .module__image img {{
      width: 100%;
      aspect-ratio: 1.2 / 1;
      object-fit: contain;
      object-position: center;
      border-radius: 0;
      filter: none;
    }}

    .final-cta {{
      padding: 150px 0;
      text-align: center;
    }}

    .final-cta__card {{
      position: relative;
      max-width: 852px;
      margin-inline: auto;
      padding: 0 32px;
      overflow: hidden;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }}

    .final-cta p {{
      max-width: 650px;
      margin: 22px auto 32px;
      color: var(--ink);
      font-size: 20px;
      line-height: 1.6;
    }}


    .site-footer {{
      border-top: 1px solid #3a4149;
      background: #283137;
      color: #fff;
      padding: 64px 0;
    }}

    .site-footer__inner {{
      max-width: 1320px;
      margin: 0 auto;
      padding: 0 80px;
    }}

    .site-footer__grid {{
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      gap: 80px;
      align-items: start;
    }}

    .footer-logo {{
      display: flex;
      align-items: center;
      margin-bottom: 16px;
    }}

    .footer-logo img {{
      width: auto;
      height: 32px;
      object-fit: contain;
    }}

    .site-footer__brand p {{
      max-width: 260px;
      margin: 0;
      color: #b0b0b0;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.65;
    }}

    .social-links {{
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 24px;
    }}

    .social-links a {{
      display: inline-flex;
      color: #b0b0b0;
      transition: color 160ms ease;
    }}

    .social-links a:hover {{
      color: #fff;
    }}

    .footer-links {{
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px 48px;
      width: 100%;
    }}

    .footer-link {{
      color: #b0b0b0;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.45;
      transition: color 160ms ease;
    }}

    .footer-link:hover {{
      color: #fff;
    }}

    .site-footer__bottom {{
      margin-top: 48px;
      padding-top: 32px;
      border-top: 1px solid #3a4149;
    }}

    .site-footer__bottom p {{
      margin: 0;
      color: #6e6e6e;
      text-align: center;
      font-size: 15px;
      font-weight: 400;
    }}

    @media (max-width: 1100px) {{
      .site-header__frame {{
        padding: 12px 16px;
      }}

      .desktop-nav {{
        gap: 24px;
        margin-left: 32px;
      }}

      .header-login,
      .header-trial {{
        padding: 0 20px;
      }}

      .hero__grid,
      .feature,
      .module__content {{
        grid-template-columns: 1fr;
      }}

      .feature--reverse .feature__visual {{
        order: 0;
      }}
    }}

    @media (max-width: 760px) {{
      .site-header__inner,
      .container,
      .site-footer__inner {{
        width: min(100% - (var(--container-pad-mobile) * 2), var(--container));
      }}

      .site-logo img {{
        width: 24px;
        height: 24px;
      }}

      .desktop-nav,
      .header-language,
      .header-login,
      .header-trial {{
        display: none;
      }}

      .mobile-menu-button {{
        display: flex;
      }}

      .hero {{
        padding: 58px 0 72px;
      }}

      .hero__grid {{
        gap: 42px;
      }}

      .hero h1 {{
        font-size: 28px;
        line-height: 36px;
        letter-spacing: 0;
      }}

      .intro h2,
      .module h2,
      .final-cta h2,
      .feature h3,
      .module__copy h3 {{
        font-size: 28px;
        line-height: 36px;
      }}

      .hero__body,
      .feature p,
      .module__copy p,
      .final-cta p {{
        font-size: 16px;
      }}

      .eyebrow {{
        min-height: auto;
        padding: 8px 16px;
        font-size: 14px;
        font-weight: 600;
        line-height: 1.4;
      }}

      .button {{
        min-height: 48px;
        font-size: 16px;
      }}

      .button {{
        width: 100%;
      }}

      .intro {{
        padding-bottom: 38px;
      }}

      .feature {{
        gap: 28px;
        padding: 48px 0;
      }}

      .module {{
        padding: 76px 0;
      }}

      .module__head {{
        margin-bottom: 36px;
      }}

      .module__tabs {{
        justify-content: flex-start;
        gap: 28px;
        margin: 0 calc(var(--container-pad-mobile) * -1) 42px;
        padding: 0 var(--container-pad-mobile) 10px;
      }}

      .module__tab {{
        min-height: 40px;
        padding-bottom: 9px;
        font-size: 16px;
      }}

      .module__content {{
        gap: 34px;
      }}

      .module__copy h3 {{
        margin-bottom: 18px;
      }}

      .module__copy p {{
        font-size: 18px;
        font-weight: 500;
      }}

      .final-cta {{
        padding: 96px 0;
      }}

      .final-cta__card {{
        padding: 0 20px;
        border-radius: 0;
      }}

      .site-footer {{
        padding: 48px 0;
      }}

      .site-footer__inner {{
        padding: 0 16px;
      }}

      .site-footer__grid {{
        grid-template-columns: 1fr;
        gap: 48px;
      }}

      .footer-links {{
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px 24px;
      }}
    }}
  </style>
</head>
<body>
  {site_header}
  {main_content}
  {site_footer}
  {module_script}
</body>
</html>
